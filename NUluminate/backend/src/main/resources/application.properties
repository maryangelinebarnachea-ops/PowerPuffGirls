# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nuluminate_db
spring.datasource.username=nuluminate_user
spring.datasource.password=nuluminate_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
# 'update' will create your tables automatically when the app starts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

# Security (Keep this as is)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Secret
jwt.secret=nuluminate-secret-key-2024-very-long-secret-string
jwt.expiration=86400000